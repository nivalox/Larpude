name: Build patches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner already has the Android SDK; just accept licenses and point Gradle at it.
      - name: Prepare the Android SDK
        run: |
          set -eu
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n 1)
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" "platforms;android-35" || true
          echo "sdk.dir=$SDK" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the .mpp bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GPR_TOKEN || github.token }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: larpude-patches
          path: patches/build/libs/*.mpp
          if-no-files-found: error

      # Morphe Manager reads the latest *published release* of the repo, so publish one.
      # Tag = v<version from gradle.properties>. Bump the version there for each new release.
      - name: Publish the release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION=$(sed -n 's/^version *= *//p' gradle.properties | tr -d ' \r')
          TAG="v$VERSION"
          MPP="patches/build/libs/patches-$VERSION.mpp"
          ls -la patches/build/libs
          cp "$MPP" .
          sha256sum "patches-$VERSION.mpp" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "patches-$VERSION.mpp" SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "patches-$VERSION.mpp" SHA256SUMS.txt \
              --target "$GITHUB_SHA" --title "$TAG" --notes "Larpude $VERSION" --latest
          fi

      # The patch catalog Manager reads. Allowed to fail so it can never block the release.
      - name: Generate patches-list.json
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GPR_TOKEN || github.token }}
        run: ./gradlew :patches:generatePatchesList --no-daemon --stacktrace

      # Morphe Manager reads patches-bundle.json from the repo root of the default branch
      # (this is the "patch metadata"). It points at the .mpp of the release made above.
      - name: Write patches-bundle.json
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -eu
          VERSION=$(sed -n 's/^version *= *//p' gradle.properties | tr -d ' \r')
          jq -n \
            --arg v "$VERSION" \
            --arg d "$(date -u +%Y-%m-%dT%H:%M:%S)" \
            --arg u "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/patches-$VERSION.mpp" \
            '{created_at:$d, description:("Larpude v" + $v + ": adds a Larpude button to the Claude app."), download_url:$u, signature_download_url:"", version:$v}' \
            > patches-bundle.json
          cat patches-bundle.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json
          [ -f patches-list.json ] && git add patches-list.json || true
          if git diff --cached --quiet; then
            echo "patches-bundle.json already current"
          else
            git commit -m "chore(release): bundle index and patch list for v$VERSION [skip ci]"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
