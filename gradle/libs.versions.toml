[versions]
morphe-patcher = "2.3.0"
# Read by the app.morphe.patches settings plugin; removing it fails configuration.
# Must match what the patcher was built against.
#noinspection GradleDependency
smali = "ac700e1942"
annotation = "1.10.0"
gson = "2.15.0"
guava = "33.8.0-jre"

[libraries]
morphe-patcher = { module = "app.morphe:morphe-patcher", version.ref = "morphe-patcher" }
annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }

[plugins]
android-library = { id = "com.android.library" }
